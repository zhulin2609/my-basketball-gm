server {
    listen 80;
    listen [::]:80;
    server_name link9.fun;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://link9.fun$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.link9.fun;
    return 308 https://www.link9.fun$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name link9.fun www.link9.fun;

    ssl_certificate /etc/nginx/tls/fullchain.crt;
    ssl_certificate_key /etc/nginx/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 当前只有这一层边缘代理，覆盖客户端自带的转发信息。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
